<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama TPV - Flujo Directo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;600&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:#f8fafc; font-family:'Sora',sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:40px;
  }
  .wrap {
    background:#fff; border:1px solid #e2e8f0; border-radius:24px; padding:40px;
    width:100%; max-width:1350px; overflow-x:auto;
    box-shadow:0 25px 50px -12px rgba(0,0,0,0.1);
  }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv" width="1300" height="900"></canvas>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const C = {
  all: '#3b6ee8', adm: '#e8883b', exit: '#ef4444',
  nodeBg: '#ffffff', dashBg: '#1a2540', text: '#1e293b'
};

const NW = 95, NH = 28; 
const HEXW = 100, HEXH = 38;

const N = {
  start:    { x:650, y:60,  shape:'cir', r:26,  fill:C.dashBg, stroke:C.all, tc:'#fff', lbl:'Inicio' },
  public:   { x:650, y:170, shape:'rec', fill:'#fff', stroke:C.exit, lbl:'Página Pública' },
  login:    { x:650, y:280, shape:'rec', fill:'#fff', stroke:C.exit, lbl:'Página de Acceso' },
  dash:     { x:650, y:410, shape:'hex', fill:C.dashBg, stroke:C.all, tc:'#fff', lbl:'Dashboard' },
  
  // ZONA GENERAL
  tpv:      { x:180, y:620, shape:'rec', fill:'#f8faff', stroke:C.all, lbl:'TPV — Ventas' },
  perfil:   { x:420, y:620, shape:'rec', fill:'#f8faff', stroke:C.all, lbl:'Mi Perfil' },
  cc:       { x:180, y:800, shape:'rec', fill:'#f0fdf4', stroke:'#10b981', lbl:'Cierre de Caja' },

  // ZONA ADMIN
  historial:{ x:700, y:650, shape:'rec', fill:'#fffcf9', stroke:C.adm, lbl:'Historial Ventas' },
  productos:{ x:960, y:650, shape:'rec', fill:'#fffcf9', stroke:C.adm, lbl:'Gestión Productos' },
  usuarios: { x:1200, y:650, shape:'rec', fill:'#fffcf9', stroke:C.adm, lbl:'Gestión Personal' }
};

function render() {
  ctx.clearRect(0,0,cv.width,cv.height);

  // 1. Zonas de Fondo
  drawZone(60, 550, 480, 150, C.all, "Acceso General");
  drawZone(630, 580, 640, 160, C.adm, "Panel Administrativo");
  drawZone(60, 740, 240, 120, '#10b981', "Finalización");

  // 2. Líneas Principales
  line(N.start.x, N.start.y+26, N.public.x, N.public.y-NH, C.all);
  line(N.public.x, N.public.y+NH, N.login.x, N.login.y-NH, C.all);
  line(N.login.x, N.login.y+NH, N.dash.x, N.dash.y-HEXH, C.all);

  // 3. Navegación (Elbows con etiquetas)
  elbow(N.dash.x-70, N.dash.y+HEXH, N.tpv.x, N.tpv.y-NH, C.all, "Abrir TPV");
  elbow(N.dash.x-30, N.dash.y+HEXH, N.perfil.x, N.perfil.y-NH, C.all, "Mi Perfil");
  
  elbow(N.dash.x+20, N.dash.y+HEXH, N.historial.x, N.historial.y-NH, C.adm, "Historial");
  elbow(N.dash.x+60, N.dash.y+HEXH, N.productos.x, N.productos.y-NH, C.adm, "Inventario");
  elbow(N.dash.x+90, N.dash.y+HEXH, N.usuarios.x, N.usuarios.y-NH, C.adm, "Personal");

  line(N.tpv.x, N.tpv.y+NH, N.cc.x, N.cc.y-NH, C.all);

  // 4. Salidas Laterales
  ctx.strokeStyle = C.exit;
  // Logout
  ctx.beginPath(); ctx.moveTo(N.cc.x-NW, N.cc.y); ctx.lineTo(20, N.cc.y); 
  ctx.lineTo(20, N.public.y); ctx.lineTo(N.public.x-NW, N.public.y); ctx.stroke();
  arrow(N.public.x-NW, N.public.y, 0, C.exit);
  // Salir
  ctx.beginPath(); ctx.moveTo(N.dash.x+HEXW, N.dash.y); ctx.lineTo(1280, N.dash.y);
  ctx.lineTo(1280, N.public.y); ctx.lineTo(N.public.x+NW, N.public.y); ctx.stroke();
  arrow(N.public.x+NW, N.public.y, Math.PI, C.exit);

  // 5. Dibujar Nodos
  Object.values(N).forEach(drawNode);
}

// Helpers
function drawNode(n) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.08)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 5;
  ctx.fillStyle = n.fill; ctx.strokeStyle = n.stroke; ctx.lineWidth = 2;
  if(n.shape === 'cir') {
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else if(n.shape === 'hex') {
    const c = 20; ctx.beginPath();
    ctx.moveTo(n.x-HEXW+c, n.y-HEXH); ctx.lineTo(n.x+HEXW-c, n.y-HEXH); ctx.lineTo(n.x+HEXW, n.y);
    ctx.lineTo(n.x+HEXW-c, n.y+HEXH); ctx.lineTo(n.x-HEXW+c, n.y+HEXH); ctx.lineTo(n.x-HEXW, n.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.roundRect(n.x-NW, n.y-NH, NW*2, NH*2, 12); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = n.tc || C.text;
  ctx.font = (n.shape === 'hex') ? 'bold 13px Sora' : '600 11.5px Sora';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(n.lbl, n.x, n.y);
}

function drawZone(x, y, w, h, col, label) {
  ctx.save();
  ctx.setLineDash([10, 5]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.fillStyle = col + '05';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col; ctx.font = 'bold 11px Space Mono';
  ctx.fillText(label.toUpperCase(), x+15, y-12);
  ctx.restore();
}

function line(x1, y1, x2, y2, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  arrow(x2, y2, Math.atan2(y2-y1, x2-x1), col);
}

function elbow(x1, y1, x2, y2, col, label) {
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x1, y1);
  const midY = y1 + (y2-y1)*0.4;
  ctx.lineTo(x1, midY); ctx.lineTo(x2, midY); ctx.lineTo(x2, y2);
  ctx.stroke();
  arrow(x2, y2, Math.PI/2, col);
  if(label) {
    ctx.font = 'bold 10px Space Mono';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'white'; ctx.fillRect(x2 - tw/2 - 4, midY - 7, tw+8, 14);
    ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(label, x2, midY+3);
  }
}

function arrow(x, y, angle, col) {
  ctx.save(); ctx.fillStyle = col; ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-12, -5); ctx.lineTo(-12, 5); ctx.fill();
  ctx.restore();
}

render();
</script>
</body>
</html>
